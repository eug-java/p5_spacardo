name: Android ARM64 with Rust FSRS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SPACARDO_ANDROID_NDK_VERSION: '28.2.13676358'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: |
          sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' "ndk;${SPACARDO_ANDROID_NDK_VERSION}"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build and verify Android ARM64 APK
        run: bash scripts/build_android_arm64.sh debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: p5-spacardo-android-arm64-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
